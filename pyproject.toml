[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-analysis"
version = "0.1.0"
description = "Lightweight analysis utilities for periodic metal-water interfaces"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "ase",
    "matplotlib",
    "tqdm",
    "scipy>=1.10",
    "cp2k-input-tools @ git+https://github.com/cp2k/cp2k-input-tools.git@393e87b",
    "pint>=0.24,<0.25",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
md-analysis = "md_analysis.cli:main"

[tool.setuptools.package-data]
"md_analysis.scripts.template" = ["*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["md_analysis*"]

[tool.pytest.ini_options]
testpaths = ["test"]
norecursedirs = ["_tmp_preview", "build", "dist", "*.egg-info"]
addopts = ["--import-mode=importlib"]
